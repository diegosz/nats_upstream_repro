name: repro
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  # Bug 2: JetStream store files stay locked after Shutdown()+WaitForShutdown().
  # Expected: red on windows-latest, green on ubuntu-latest (control).
  filestore-lock:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        versions: [pinned, latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: pinned (nats-server v2.14.5, nats.go v1.53.1)
        if: matrix.versions == 'pinned'
        shell: bash
        run: go test -count=1 -v ./filestore_lock/
      - name: latest releases
        if: matrix.versions == 'latest'
        shell: bash
        run: scripts/with-latest.sh -v ./filestore_lock/

